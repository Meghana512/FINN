services:
  - type: web
    name: finn-intelligence-api
    env: node
    plan: free
    region: oregon
    rootDir: finn-intelligence/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: /tmp/finn.db
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TEJHQ_BASE_URL
        value: https://api.tejhq.dev
      - key: TEJHQ_API_KEY
        sync: false
      - key: TEJHQ_EXCHANGE
        value: nse
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.8-flash
